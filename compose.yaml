services:

  postgres_app:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: test_task_db
    ports:
      - "5433:5432"

  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres_app

  tests:
    build: .
    environment:
      DB_DIALECT: postgresql
      DB_DRIVER: psycopg2
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres_test
      DB_PORT: 5432
      DB_NAME: test_task_db
    depends_on:
      - postgres_test
    command: pytest

volumes:
  postgres_data: